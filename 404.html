<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>404 — CARTOON INSIDE 😺</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
}

body {

    min-height: 100vh;

    display: flex;

    justify-content: center;

    align-items: center;

    padding: 25px;

    text-align: center;

    font-family: Arial, sans-serif;

    color: white;

    background:
        radial-gradient(
            circle at 20% 20%,
            rgba(255, 200, 0, 0.18),
            transparent 35%
        ),

        radial-gradient(
            circle at 80% 80%,
            rgba(255, 180, 0, 0.12),
            transparent 35%
        ),

        #000;
}


.container {

    width: 100%;

    max-width: 500px;
}


.icon {

    font-size: 70px;

    margin-bottom: 10px;

    filter:
        drop-shadow(
            0 0 20px
            rgba(255, 208, 0, 0.5)
        );
}


.error {

    margin: 0;

    color: #ffd000;

    font-size: 90px;

    font-weight: bold;

    letter-spacing: 5px;

    text-shadow:
        0 0 25px
        rgba(255, 208, 0, 0.5);
}


.title {

    margin-top: 5px;

    font-size: 25px;

    letter-spacing: 3px;
}


.message {

    margin: 15px auto 30px;

    max-width: 380px;

    color: #888;

    font-size: 14px;

    line-height: 1.6;
}


.home-button {

    display: inline-block;

    padding: 14px 28px;

    border-radius: 12px;

    background: #ffd000;

    color: #000;

    text-decoration: none;

    font-size: 14px;

    font-weight: bold;

    letter-spacing: 2px;

    box-shadow:
        0 0 25px
        rgba(255, 208, 0, 0.25);

    transition: 0.2s;
}


.home-button:hover {

    transform: scale(1.05);

}


.home-button:active {

    transform: scale(0.96);

}


.footer {

    margin-top: 35px;

    color: #444;

    font-size: 10px;

    letter-spacing: 3px;
}


@media (max-width: 500px) {

    .error {

        font-size: 70px;

    }

    .title {

        font-size: 21px;

    }

}

</style>

</head>


<body>


<div class="container">

    <div class="icon">
        😺
    </div>


    <h1 class="error">
        404
    </h1>


    <div class="title">
        CARTOON NOT FOUND
    </div>


    <div class="message">
        Looks like you've entered a mysterious
        part of the internet. This page doesn't exist.
    </div>


    <a
        class="home-button"
        href="/"
    >
        RETURN HOME
    </a>


    <div class="footer">
        CARTOON INSIDE • DIGITAL EXPERIENCE
    </div>

</div>


</body>

  </html>
